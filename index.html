<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光记账</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body>
<aside><b class="brand">◈ 拾光记账</b><p>把生活记清楚</p><nav>我的账本</nav><div class="motto">认真记录每一笔，<br>让生活更有余地。<small>本地保存 · 无需登录</small></div></aside><main>
<header><div><small>MY PERSONAL LEDGER</small><h1>我的账本</h1><p>每一笔，都有迹可循。</p></div><label>统计月份<input id="month" type="month" required></label></header>
<section class="summary"><article class="balance"><span>本月结余</span><strong id="balance">¥0.00</strong><small>本月收入 − 本月支出</small></article><article><span>↗ 本月收入</span><strong id="income">¥0.00</strong><small id="ic"></small></article><article><span>↘ 本月支出</span><strong id="expense">¥0.00</strong><small id="ec"></small></article></section>
<div class="columns"><section class="card"><div class="title"><h2>记一笔</h2><small>记录当下的生活</small></div><form id="form"><div class="tabs"><button type="button" data-type="expense" class="selected" aria-pressed="true">− 支出</button><button type="button" data-type="income" aria-pressed="false">＋ 收入</button></div><label>金额（元）<input class="amount" id="amount" type="number" min="0.01" max="999999999.99" step="0.01" placeholder="0.00" required></label><div class="grid"><label>分类<select id="category"></select></label><label>日期<input id="date" type="date" required></label></div><label>备注（选填）<input id="note" maxlength="100" placeholder="记录这笔收支的小故事"></label><button class="primary">＋ 保存这笔账</button><p class="hint">小小的记录，也是好好生活的一部分。</p></form></section><section class="card"><div class="title"><h2>支出分布</h2><small>钱都花在哪里了</small></div><div id="chart"></div></section></div>
<section class="card"><div class="title"><h2>收支明细 <small id="count"></small></h2><select id="filter" aria-label="筛选明细"><option value="all">全部类型</option><option value="expense">仅支出</option><option value="income">仅收入</option></select></div><div class="scroll"><table><thead><tr><th>分类 / 备注</th><th>日期</th><th>类型</th><th>金额</th><th>操作</th></tr></thead><tbody id="records"></tbody></table></div><div class="empty" id="empty">✧<h3>这个月，故事还没开始</h3><p>记下第一笔收支，开启有条理的生活。</p></div></section>
<footer>拾光记账 · 数据仅保存在当前浏览器，请定期备份呀。chris</footer><details><summary>数据备份与恢复</summary><p>导出全部月份；导入将替换所有当前账目。</p><button id="export">导出备份</button> <label class="import">导入备份<input id="import" type="file" accept=".json,application/json" hidden></label></details></main><div id="toast" role="status" aria-live="polite"></div></body></html>
